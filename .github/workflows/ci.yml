name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in scripts/*.sh agent-monitor.tmux install.sh icons/generate.sh; do
            bash -n "$f"
          done
      - name: Shellcheck
        run: shellcheck scripts/*.sh agent-monitor.tmux install.sh icons/generate.sh
      - name: Picker regression tests
        run: python3 -m unittest discover -s tests -v
